<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>AirBnB clone</title>
    <link rel="icon" href="images/icon.png">
    <link rel="stylesheet" href="styles/4-common.css">
    <link rel="stylesheet" href="styles/3-header.css">
    <link rel="stylesheet" href="styles/3-footer.css">
    <link rel="stylesheet" href="styles/6-filters.css">
    <link rel="stylesheet" href="styles/7-places.css">
  </head>
  <body>
    <header></header>

    <div class="container">
      <section class="filters">
        <div class="locations">
          <h3>States</h3>
          <h4>&nbsp;</h4>
          <ul class="popover">
            <li>
              <h2>California</h2>
              <ul>
                <li>San Francisco</li>
                <li>Los Angeles</li>
              </ul>
            </li>
            <li>
              <h2>Texas</h2>
              <ul>
                <li>Austin</li>
                <li>Houston</li>
              </ul>
            </li>
            <li>
              <h2>Arizona</h2>
              <ul>
                <li>Phoenix</li>
                <li>Tucson</li>
              </ul>
            </li>
          </ul>
        </div>

        <div class="amenities">
          <h3>Amenities</h3>
          <h4>&nbsp;</h4>
          <ul class="popover">
            <li>Wifi</li>
            <li>Pool</li>
            <li>Kitchen</li>
            <li>Parking</li>
          </ul>
        </div>

        <button type="button">Search</button>
      </section>

      <section class="places">
        <h1>Places</h1>
        <article>
          <h2>Cozy Studio Downtown</h2>
        </article>
        <article>
          <h2>Beach House</h2>
        </article>
        <article>
          <h2>Mountain Cabin</h2>
        </article>
        <article>
          <h2>Modern Loft</h2>
        </article>
      </section>
    </div>

    <footer>
      <p>Best School</p>
    </footer>
  </body>
</html>
